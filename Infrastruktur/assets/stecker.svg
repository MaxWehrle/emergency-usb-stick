<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 190" role="img" aria-labelledby="title desc">
  <title id="title">Zwei USB-Steckerformen</title>
  <desc id="desc">Links ein breiter rechteckiger USB-A-Stecker für viele PCs. Rechts ein kleiner ovaler USB-C-Stecker für viele neuere Android-Handys.</desc>
  <rect width="680" height="190" rx="18" fill="#e9f1ed"/>
  <rect x="70" y="46" width="174" height="70" rx="7" fill="#c8d9d6" stroke="#173242" stroke-width="5"/>
  <rect x="89" y="58" width="136" height="46" rx="3" fill="#fff" stroke="#173242" stroke-width="4"/>
  <text x="157" y="151" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#173242">USB-A</text>
  <rect x="427" y="55" width="156" height="62" rx="31" fill="#c8d9d6" stroke="#173242" stroke-width="5"/>
  <rect x="443" y="67" width="124" height="38" rx="19" fill="#fff" stroke="#173242" stroke-width="3"/>
  <text x="505" y="151" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#173242">USB-C</text>
</svg>
