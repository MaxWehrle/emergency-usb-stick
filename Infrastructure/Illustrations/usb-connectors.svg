<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 170" role="img" aria-labelledby="t d"><title id="t">USB-A and USB-C connector shapes</title><desc id="d">USB-A is wide and rectangular; USB-C is smaller and oval.</desc><rect width="640" height="170" rx="18" fill="#edf5f2"/><g fill="none" stroke="#173f3c" stroke-width="5"><rect x="55" y="43" width="155" height="75" rx="7"/><rect x="280" y="51" width="112" height="59" rx="30"/></g><g fill="#173f3c" font-family="Arial,sans-serif" font-size="24"><text x="87" y="149">USB-A</text><text x="298" y="149">USB-C</text><text x="462" y="70" font-size="18">Check the port</text><text x="462" y="99" font-size="18">on your device.</text></g></svg>
