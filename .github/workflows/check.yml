name: Technical checks
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '17 8 1 * *'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/verify.py
